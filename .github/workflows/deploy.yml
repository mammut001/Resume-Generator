name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Validate deployment secret
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::Repository secret VPS_SSH_KEY is missing. See docs/cicd-deployment.md."
            exit 1
          fi

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/known_hosts <<'EOF'
          |1|dsPACgx2oohoPK+7mwynfNEjbMQ=|FuqgW60uLgxJG66gHRGvFbe2SPw= ssh-rsa 
          |1|k9AH0wtIT0ZfxJXFTQTizGMD+kw=|Hd6JOwpcXxEvcghU3o/UWpGG2Oc= ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBGB0UU8k71x6q8M+lykxw6QDcwORBLkfHLV9+mJUXSByzvfgtU7B8hkcUePuEXfFEzKymyNqMuXMMxF77P2FwT0=
          |1|o8D5nytACEPbkxjCv/UmObhewiw=|sKvPFfv4DQkFbsa39ahzvui80q4= ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGiMrLXuvh0jnX74yB6DZnqJfBNBy1/Jpfo/6J9NiRuE
          EOF
          chmod 644 ~/.ssh/known_hosts

      - name: Sync commit and restart service
        env:
          DEPLOY_SHA: ${{ github.sha }}
          VPS_HOST: 149.56.97.109
          VPS_USER: ubuntu
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            "${VPS_USER}@${VPS_HOST}" "DEPLOY_SHA=${DEPLOY_SHA} bash -s" <<'REMOTE'
            set -Eeuo pipefail

            app_dir=/home/ubuntu/resume-generator
            repo_url=https://github.com/mammut001/Resume-Generator.git

            on_error() {
              local exit_code=$?
              echo "::error::Deployment failed with exit code ${exit_code}."
              git -C "$app_dir" status --short --branch 2>/dev/null || true
              docker compose -f "$app_dir/docker-compose.yml" ps 2>/dev/null || true
              docker logs --tail 80 resume-generator 2>/dev/null || true
              exit "$exit_code"
            }
            trap on_error ERR

            mkdir -p "$app_dir"
            cd "$app_dir"

            [ -f .env ] || { echo "::error::$app_dir/.env is missing"; exit 1; }
            [ -d data ] || { echo "::error::$app_dir/data is missing"; exit 1; }

            if ! git rev-parse --git-dir >/dev/null 2>&1; then
              git init
              git remote add origin "$repo_url"
            elif ! git remote get-url origin >/dev/null 2>&1; then
              git remote add origin "$repo_url"
            else
              git remote set-url origin "$repo_url"
            fi

            echo "Deploying commit $DEPLOY_SHA"
            git fetch --prune --no-tags origin main
            git cat-file -e "${DEPLOY_SHA}^{commit}"
            git reset --hard "$DEPLOY_SHA"
            git clean -fdx -e .env -e '.env.*' -e data

            [ "$(git rev-parse HEAD)" = "$DEPLOY_SHA" ] || {
              echo "::error::VPS checkout does not match the triggering commit"
              exit 1
            }
            [ -f eng.traineddata ] || { echo "::error::eng.traineddata is missing"; exit 1; }

            docker compose config --quiet
            docker compose up -d --build --force-recreate resume-generator

            healthy=0
            for attempt in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8790/health | grep -q '"ok":true'; then
                healthy=1
                break
              fi
              echo "Waiting for health check (${attempt}/30)..."
              sleep 2
            done

            [ "$healthy" -eq 1 ] || {
              echo "::error::Service did not become healthy within 60 seconds"
              exit 1
            }

            curl -fsS -o /dev/null http://127.0.0.1:8790/
            echo "Deploy OK: $(git rev-parse --short HEAD)"
            docker compose ps resume-generator
          REMOTE
