name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Pin VPS host keys
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat > ~/.ssh/known_hosts <<'EOF'
          |1|dsPACgx2oohoPK+7mwynfNEjbMQ=|FuqgW60uLgxJG66gHRGvFbe2SPw= ssh-rsa 
          |1|k9AH0wtIT0ZfxJXFTQTizGMD+kw=|Hd6JOwpcXxEvcghU3o/UWpGG2Oc= ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBGB0UU8k71x6q8M+lykxw6QDcwORBLkfHLV9+mJUXSByzvfgtU7B8hkcUePuEXfFEzKymyNqMuXMMxF77P2FwT0=
          |1|o8D5nytACEPbkxjCv/UmObhewiw=|sKvPFfv4DQkFbsa39ahzvui80q4= ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGiMrLXuvh0jnX74yB6DZnqJfBNBy1/Jpfo/6J9NiRuE
          EOF
          chmod 644 ~/.ssh/known_hosts

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy
        env:
          VPS_HOST: 149.56.97.109
          VPS_USER: ubuntu
        run: |
          ssh -o StrictHostKeyChecking=yes ${VPS_USER}@${VPS_HOST} bash -s <<'REMOTE'
            set -euo pipefail
            cd /home/ubuntu/resume-generator

            # VPS-only files the build/runtime need. Fail loudly if any are missing.
            [ -f eng.traineddata ] || { echo "::error::eng.traineddata missing on VPS"; exit 1; }
            [ -f .env ]            || { echo "::error::.env missing on VPS"; exit 1; }
            [ -d data ]            || { echo "::error::data/ missing on VPS"; exit 1; }

            # Force the working tree to match origin/main. data/, .env, and
            # eng.traineddata are excluded from `git clean` so they survive.
            git fetch
            git reset --hard origin/main
            git clean -fd -e data -e .env -e eng.traineddata

            echo "== HEAD =="
            git log -1 --oneline

            echo "== build + restart =="
            docker compose up -d --build

            echo "== container status =="
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" --filter "name=resume-generator"

            sleep 3
            echo "== recent logs =="
            docker logs --tail 30 resume-generator

            echo "== health check =="
            curl -fsS -o /dev/null -w "SPA  HTTP %{http_code}  %{size_download} bytes\n" http://127.0.0.1:8790/
            ASSET=$(curl -fsS http://127.0.0.1:8790/ | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -1)
            curl -fsS -o /dev/null -w "JS   HTTP %{http_code}  %{size_download} bytes  $ASSET\n" "http://127.0.0.1:8790$ASSET"
          REMOTE
