services:
  resume-generator:
    build: .
    container_name: resume-generator
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      RESUME_STATIC_DIR: /app/dist
      # For a high-port same-origin pilot this can be *, but set an exact origin
      # before putting the backend behind a public HTTPS frontend/domain.
      TYPST_RENDER_ALLOWED_ORIGIN: ${TYPST_RENDER_ALLOWED_ORIGIN:-*}
      RESUME_INTAKE_ATTEMPT_LIMIT: ${RESUME_INTAKE_ATTEMPT_LIMIT:-30}
      RESUME_TAILORING_ATTEMPT_LIMIT: ${RESUME_TAILORING_ATTEMPT_LIMIT:-30}
      RESUME_INTAKE_PDF_OCR_ENABLED: ${RESUME_INTAKE_PDF_OCR_ENABLED:-false}
      # Frontend analytics ingestion. With RESUME_ANALYTICS_SQLITE_PATH set and VITE_ANALYTICS_ENDPOINT
      # pointing to /api/analytics/event (default in the built frontend), the browser sendBeacon sink
      # persists sanitized events to this sqlite file under /app/data.
      RESUME_ANALYTICS_SQLITE_PATH: ${RESUME_ANALYTICS_SQLITE_PATH:-}
      RESUME_ANALYTICS_SUMMARY_TOKEN: ${RESUME_ANALYTICS_SUMMARY_TOKEN:-}
      RESUME_ANALYTICS_HMAC_SECRET: ${RESUME_ANALYTICS_HMAC_SECRET:-}
      VITE_ANALYTICS_ENDPOINT: ${VITE_ANALYTICS_ENDPOINT:-/api/analytics/event}
    ports:
      - "${RESUME_HOST_PORT:-8790}:8787"
    volumes:
      - ./data:/app/data
